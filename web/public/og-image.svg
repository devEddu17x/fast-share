<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="emeraldGlow" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glassmorphic Card Linear Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111113" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0.7" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Feature Pill Gradients -->
    <linearGradient id="blueBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#172554" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="amberBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="emeraldBadge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="1200" height="630" fill="#09090b" />

  <!-- Ambient Color Lighting -->
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />
  <rect width="1200" height="630" fill="url(#amberGlow)" />
  <rect width="1200" height="630" fill="url(#blueGlow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Main Hero Brand Center -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Icon Squircle with glow -->
    <rect x="-44" y="-72" width="88" height="88" rx="22" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Vector Lightning Bolt -->
    <path d="M 4 -54 L -18 -32 L -3 -32 L -10 -2 L 18 -24 L 2 -24 Z" fill="url(#boltGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" />

    <!-- App Title -->
    <text x="0" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1.5">
      Fast Share
    </text>

    <!-- App Tagline -->
    <text x="0" y="104" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#a1a1aa" letter-spacing="-0.3">
      Zero-Friction Ephemeral Sharing &amp; Real-Time Workstation
    </text>
  </g>

  <!-- Feature Pills Row -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <!-- Blue: File Transfer -->
    <g transform="translate(-320, 0)">
      <rect x="-135" y="-18" width="270" height="36" rx="18" fill="url(#blueBadge)" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="-110" cy="0" r="4" fill="#60a5fa" />
      <text x="-95" y="5" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="start">
        FILE DROP (UP TO 500 MB)
      </text>
    </g>

    <!-- Amber: Code IDE -->
    <g transform="translate(0, 0)">
      <rect x="-120" y="-18" width="240" height="36" rx="18" fill="url(#amberBadge)" stroke="#d97706" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="-95" cy="0" r="4" fill="#fbbf24" />
      <text x="-80" y="5" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="600" fill="#fde68a" text-anchor="start">
        CODE IDE &amp; FIND/REPLACE
      </text>
    </g>

    <!-- Emerald: URL Shortener -->
    <g transform="translate(320, 0)">
      <rect x="-135" y="-18" width="270" height="36" rx="18" fill="url(#emeraldBadge)" stroke="#059669" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="-110" cy="0" r="4" fill="#34d399" />
      <text x="-95" y="5" font-family="system-ui, -apple-system, monospace" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="start">
        FAST URL SHORTENER &amp; ROOM
      </text>
    </g>
  </g>

  <!-- Bottom Workspace Mockup Preview -->
  <g transform="translate(140, 365)">
    <!-- Container Box -->
    <rect width="920" height="210" rx="16" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5" />

    <!-- Chrome Header -->
    <rect width="920" height="36" rx="16" fill="#18181b" />
    <rect y="20" width="920" height="16" fill="#18181b" />
    <line x1="0" y1="36" x2="920" y2="36" stroke="#27272a" stroke-width="1" />

    <!-- Traffic lights -->
    <circle cx="24" cy="18" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="42" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="18" r="5" fill="#10b981" opacity="0.8" />

    <!-- Split Divider -->
    <line x1="520" y1="36" x2="520" y2="210" stroke="#27272a" stroke-width="1" />

    <!-- Left Column (Live Stream) -->
    <!-- Event 1: File Drop -->
    <rect x="20" y="52" width="480" height="42" rx="8" fill="#18181b" stroke="#1e3a8a" stroke-width="1" stroke-opacity="0.4" />
    <rect x="32" y="60" width="26" height="26" rx="6" fill="#1e3a8a" fill-opacity="0.5" />
    <text x="70" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#93c5fd">project_architecture_diagram.png</text>
    <text x="440" y="77" font-family="monospace" font-size="11" fill="#71717a">12.4 MB</text>

    <!-- Event 2: Code Snippet -->
    <rect x="20" y="104" width="480" height="42" rx="8" fill="#18181b" stroke="#78350f" stroke-width="1" stroke-opacity="0.4" />
    <rect x="32" y="112" width="26" height="26" rx="6" fill="#78350f" fill-opacity="0.5" />
    <text x="70" y="130" font-family="monospace" font-size="12" font-weight="500" fill="#fde68a">const share = await fetch("/api/share");</text>
    <text x="440" y="129" font-family="monospace" font-size="11" fill="#71717a">8 lines</text>

    <!-- Event 3: Short Link -->
    <rect x="20" y="156" width="480" height="42" rx="8" fill="#18181b" stroke="#064e3b" stroke-width="1" stroke-opacity="0.4" />
    <rect x="32" y="164" width="26" height="26" rx="6" fill="#064e3b" fill-opacity="0.5" />
    <text x="70" y="182" font-family="monospace" font-size="13" font-weight="600" fill="#34d399">/demo-preview</text>
    <text x="210" y="181" font-family="system-ui, sans-serif" font-size="11" fill="#71717a">➔ https://your-link.to/demo</text>
    <text x="440" y="181" font-family="monospace" font-size="11" fill="#71717a">42 clicks</text>

    <!-- Right Column (Active Tool Workspace) -->
    <!-- Tabs Header -->
    <rect x="540" y="52" width="360" height="34" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <rect x="544" y="56" width="116" height="26" rx="6" fill="#27272a" />
    <text x="602" y="73" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f4f4f5" text-anchor="middle">Send</text>
    <text x="720" y="73" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#71717a" text-anchor="middle">Files</text>
    <text x="838" y="73" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#71717a" text-anchor="middle">Shorten</text>

    <!-- Composer Box Mockup -->
    <rect x="540" y="96" width="360" height="98" rx="8" fill="#0f0f11" stroke="#27272a" stroke-width="1" />
    <text x="556" y="122" font-family="monospace" font-size="12" fill="#71717a">// Paste or write code snippet here...</text>
    <rect x="556" y="156" width="90" height="26" rx="6" fill="#27272a" />
    <text x="601" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#e4e4e7" text-anchor="middle">Attach File</text>
    <rect x="826" y="156" width="62" height="26" rx="6" fill="#f4f4f5" />
    <text x="857" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#09090b" text-anchor="middle">Send</text>
  </g>
</svg>
